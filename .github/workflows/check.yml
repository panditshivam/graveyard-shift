name: Check the graveyard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  authored-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_core
      - run: python -m compileall -q fixture.py history.py ritual.py model.py server.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js
